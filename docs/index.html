<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)} body{margin:0;font:14px system-ui,-apple-system,sans-serif} [hidden]{display:none!important}</style>
</head>
<body>
<title>Treasure Chest Viewer</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Spectral+SC:wght@600&family=Figtree:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
  /* Layout: full-bleed 3D stage, a title plate up top, a brass-trimmed control tray at the bottom. One deliberate dark look (an item-inspect screen). */
  :root {
    --bg: #080605;          /* walnut shadow */
    --tray: rgba(34, 26, 20, 0.86);
    --fg: #f2e7d6;          /* parchment */
    --muted: #b6a48d;
    --brass: #d6a64a;
    --brass-ink: #22180c;
    --line: rgba(242, 231, 214, 0.14);
    --chip: rgba(242, 231, 214, 0.07);
    --f-display: "Spectral SC", "Iowan Old Style", Georgia, serif;
    --f-body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
    --f-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
    color-scheme: dark;
  }
  html, body { height: 100%; }
  [hidden] { display: none !important; }
  body { background: var(--bg); color: var(--fg); font-family: var(--f-body); overflow: hidden; -webkit-tap-highlight-color: transparent; }
  #stage { position: fixed; inset: 0; }
  #stage canvas { display: block; width: 100%; height: 100%; touch-action: none; }

  .plate {
    position: fixed; top: 0; left: 0; right: 0; pointer-events: none;
    padding-top: calc(14px + env(safe-area-inset-top, 0px));
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-bottom: 28px;
    background: linear-gradient(to bottom, rgba(8, 6, 5, 0.85), rgba(8, 6, 5, 0));
    display: flex; flex-direction: column; gap: 4px;
  }
  .plate h1 { margin: 0; font-family: var(--f-display); font-weight: 600; font-size: 1.55rem; letter-spacing: 0.04em; line-height: 1.1; text-wrap: balance; }
  .plate .sub { margin: 0; color: var(--muted); font-size: 0.86rem; }
  .stats { font-family: var(--f-mono); font-size: 0.74rem; color: var(--brass); letter-spacing: 0.02em; font-variant-numeric: tabular-nums; }

  .tray {
    position: fixed; left: 0; right: 0; bottom: 0;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-top: 14px;
    padding-bottom: calc(14px + env(safe-area-inset-bottom, 0px));
    background: var(--tray);
    border-top: 1px solid rgba(214, 166, 74, 0.35);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    display: flex; justify-content: center;
  }
  .tray-inner { width: 100%; max-width: 560px; display: grid; gap: 12px; }

  .seg { display: grid; grid-template-columns: 1fr 1fr; background: var(--chip); border: 1px solid var(--line); border-radius: 10px; padding: 3px; gap: 3px; }
  .seg button { appearance: none; border: 0; background: transparent; color: var(--muted); font: 500 0.86rem/1 var(--f-body); padding: 10px 8px; border-radius: 7px; cursor: pointer; min-width: 0; }
  .seg button[aria-pressed="true"] { background: var(--fg); color: var(--brass-ink); }

  .row { display: flex; align-items: center; gap: 12px; }
  .primary {
    appearance: none; border: 0; cursor: pointer; flex: 0 0 auto;
    background: var(--brass); color: var(--brass-ink);
    font: 600 0.95rem/1 var(--f-body); padding: 13px 18px; border-radius: 10px; min-width: 112px;
    box-shadow: inset 0 -2px 0 rgba(0, 0, 0, 0.22), inset 0 1px 0 rgba(255, 240, 200, 0.45);
  }
  .primary:disabled { opacity: 0.4; cursor: not-allowed; }
  .slider { flex: 1 1 auto; min-width: 0; display: grid; gap: 4px; }
  .slider label { display: flex; justify-content: space-between; font-size: 0.74rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; }
  .slider label output { font-family: var(--f-mono); color: var(--fg); letter-spacing: 0; text-transform: none; font-variant-numeric: tabular-nums; }
  input[type="range"] { width: 100%; accent-color: var(--brass); margin: 0; }
  input[type="range"]:disabled { opacity: 0.4; }

  .chips { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .chip { appearance: none; cursor: pointer; border: 1px solid var(--line); background: var(--chip); color: var(--fg); font: 500 0.8rem/1 var(--f-body); padding: 8px 12px; border-radius: 999px; }
  .chip[aria-pressed="true"] { border-color: var(--brass); color: var(--brass); }
  .chip:disabled { opacity: 0.4; cursor: not-allowed; }
  .lightpanel { display: grid; gap: 10px; padding-bottom: 4px; border-bottom: 1px solid var(--line); }
  .swatches { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .sw { appearance: none; width: 28px; height: 28px; border-radius: 50%; border: 2px solid var(--line); cursor: pointer; padding: 0; }
  .sw[aria-pressed="true"] { border-color: var(--fg); box-shadow: 0 0 0 2px var(--brass); }
  .custom { display: flex; align-items: center; gap: 6px; font-size: 0.78rem; color: var(--muted); margin-left: 4px; }
  .custom input { width: 34px; height: 28px; border: 1px solid var(--line); border-radius: 6px; background: transparent; padding: 0; }
  .hint { margin-left: auto; color: var(--muted); font-size: 0.74rem; }

  button:focus-visible, input:focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; }

  .loader { position: fixed; inset: 0; display: grid; place-items: center; pointer-events: none; color: var(--muted); font-family: var(--f-mono); font-size: 0.8rem; }
  .toast {
    position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(210px + env(safe-area-inset-bottom, 0px));
    background: rgba(12, 9, 7, 0.9); color: var(--fg); border: 1px solid var(--line);
    padding: 10px 14px; border-radius: 10px; font-size: 0.84rem; max-width: calc(100% - 32px); text-align: center;
    opacity: 0; transition: opacity 0.25s ease; pointer-events: none;
  }
  .toast.show { opacity: 1; }
  @media (max-width: 420px) { .hint { display: none; } .plate h1 { font-size: 1.35rem; } }
  @media (prefers-reduced-motion: reduce) { .toast { transition: none; } }
</style>

<div id="stage" aria-label="3D view of the treasure chest. Drag to orbit, pinch or scroll to zoom, tap the chest to open it."></div>

<header class="plate">
  <h1>Treasure Chest</h1>
  <p class="sub" id="sub">Rebuilt in Godot from a Meshy 7 scan</p>
  <div class="stats" id="stats">Loading…</div>
</header>

<div class="loader" id="loader">Loading chest…</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<nav class="tray" aria-label="Viewer controls">
  <div class="tray-inner">
    <div class="seg" role="group" aria-label="Model">
      <button id="m-rebuilt" type="button" aria-pressed="true">Rebuilt in Godot</button>
      <button id="m-meshy" type="button" aria-pressed="false">Meshy 7 original</button>
    </div>
    <div class="row">
      <button class="primary" id="toggle" type="button">Open lid</button>
      <div class="slider">
        <label for="lid">Lid angle <output id="lid-out" for="lid">0°</output></label>
        <input id="lid" type="range" min="0" max="110" step="1" value="0">
      </div>
    </div>
    <div class="lightpanel" id="lightpanel" hidden>
      <div class="slider">
        <label for="l-int">Spotlight <output id="l-int-out" for="l-int">100%</output></label>
        <input id="l-int" type="range" min="0" max="200" step="1" value="100">
      </div>
      <div class="slider">
        <label for="l-rad">Light radius <output id="l-rad-out" for="l-rad">1.10 m</output></label>
        <input id="l-rad" type="range" min="40" max="220" step="1" value="110">
      </div>
      <div class="swatches" role="group" aria-label="Light color">
        <button class="sw" type="button" data-c="#ffe2b8" aria-pressed="true" aria-label="Candle white" style="background:#ffe2b8"></button>
        <button class="sw" type="button" data-c="#ffc061" aria-pressed="false" aria-label="Gold" style="background:#ffc061"></button>
        <button class="sw" type="button" data-c="#ff8a4a" aria-pressed="false" aria-label="Ember" style="background:#ff8a4a"></button>
        <button class="sw" type="button" data-c="#b9c9ff" aria-pressed="false" aria-label="Moonlight" style="background:#b9c9ff"></button>
        <button class="sw" type="button" data-c="#c49bff" aria-pressed="false" aria-label="Arcane violet" style="background:#c49bff"></button>
        <button class="sw" type="button" data-c="#7fffd2" aria-pressed="false" aria-label="Spirit green" style="background:#7fffd2"></button>
        <label class="custom" for="l-col">Custom <input id="l-col" type="color" value="#ffe2b8"></label>
      </div>
    </div>
    <div class="chips">
      <button class="chip" id="lightbtn" type="button" aria-pressed="false" aria-expanded="false" aria-controls="lightpanel">Light</button>
      <button class="chip" id="paint" type="button" aria-pressed="true">Meshy paint</button>
      <button class="chip" id="spin" type="button" aria-pressed="true">Spin</button>
      <button class="chip" id="wire" type="button" aria-pressed="false">Wireframe</button>
      <button class="chip" id="vacuum" type="button" aria-pressed="true">On close: vacuum loot back</button>
      <span class="hint">Drag to orbit · tap the chest</span>
    </div>
  </div>
</nav>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";
import { EffectComposer } from "three/addons/postprocessing/EffectComposer.js";
import { RenderPass } from "three/addons/postprocessing/RenderPass.js";
import { UnrealBloomPass } from "three/addons/postprocessing/UnrealBloomPass.js";
import { OutputPass } from "three/addons/postprocessing/OutputPass.js";
import { ShaderPass } from "three/addons/postprocessing/ShaderPass.js";

const MAX_OPEN = 110;
const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
const $ = (id) => document.getElementById(id);

// ---------- renderer / scene
const stage = $("stage");
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, Math.min(innerWidth, innerHeight) < 700 ? 1.6 : 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.3;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
stage.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const BG = new THREE.Color("#080605");
scene.background = BG;
scene.fog = new THREE.Fog(BG, 3.0, 7.0);
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(renderer), 0.04).texture;

const camera = new THREE.PerspectiveCamera(32, 1, 0.05, 50);
let camShake = 0;
const camShakeOff = new THREE.Vector3();
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0.36, 0);
camera.position.set(-0.62, 0.78, 1.0);
controls.enableDamping = true;
controls.enablePan = false;
controls.minDistance = 1.2;
controls.maxDistance = 16;
controls.maxPolarAngle = Math.PI * 0.49;
controls.autoRotate = !reduceMotion;
controls.autoRotateSpeed = 0.8;

const key = new THREE.DirectionalLight("#fff1dc", 0.22);
key.position.set(-2.2, 3.4, 2.6);
key.castShadow = false;
key.shadow.mapSize.set(2048, 2048);
Object.assign(key.shadow.camera, { left: -1.2, right: 1.2, top: 1.2, bottom: -1.2, near: 0.5, far: 10 });
key.shadow.bias = -0.0004;
key.shadow.normalBias = 0.02;
scene.add(key);
const rim = new THREE.DirectionalLight("#9fb3ff", 0.35);
rim.position.set(2.5, 1.6, -2.5);
scene.add(rim);
scene.add(new THREE.HemisphereLight("#e8dccb", "#2a1d13", 0.12));

const floor = new THREE.Mesh(new THREE.CircleGeometry(12, 64), new THREE.MeshStandardMaterial({ color: "#1c1510", roughness: 0.9, envMapIntensity: 0.03 }));
floor.rotation.x = -Math.PI / 2;
floor.receiveShadow = true;
scene.add(floor);

// ---------- procedural materials (ports of wood.gdshader / brass.gdshader)
const GLSL_COMMON = `
varying vec3 vLpos;
float hsh(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
float vn(vec2 p){ vec2 i = floor(p); vec2 f = fract(p); vec2 u = f*f*(3.0-2.0*f);
  return mix(mix(hsh(i), hsh(i+vec2(1.0,0.0)), u.x), mix(hsh(i+vec2(0.0,1.0)), hsh(i+vec2(1.0,1.0)), u.x), u.y); }
float fb(vec2 p){ float v = 0.0; float a = 0.5; for (int k = 0; k < 4; k++) { v += a*vn(p); p *= 2.03; a *= 0.5; } return v; }
vec3 s2l(vec3 c){ return pow(c, vec3(2.2)); }
float gA; float gB;
#ifdef CHEST_BAKED
varying vec2 vBakeUv;
uniform sampler2D bakeMap; uniform sampler2D ormMap; uniform float uBake; uniform float uDebug;
vec4 gOrm; float gBm;
#endif
`;
// Meshy's paint, baked into a second UV set. Alpha = transfer confidence; 0 falls back to the procedural shader.
const BAKE_COLOR = `
#ifdef CHEST_BAKED
  vec4 bk = texture2D(bakeMap, vBakeUv);
  gOrm = texture2D(ormMap, vBakeUv);
  gBm = bk.a * uBake;
  diffuseColor.rgb = mix(diffuseColor.rgb, bk.rgb, gBm);
  diffuseColor.rgb = mix(diffuseColor.rgb, diffuseColor.rgb * 1.2, vColor.g * 0.35 * gBm);
  diffuseColor.rgb = mix(diffuseColor.rgb, vec3(1.0, 0.0, 1.0), uDebug * (1.0 - bk.a));
#endif`;
const BAKE_ROUGH = `
#ifdef CHEST_BAKED
  roughnessFactor = mix(roughnessFactor, gOrm.g, gOrm.a * uBake);
#endif`;
const BAKE_METAL = `float metalnessFactor = metalness;
#ifdef CHEST_BAKED
  metalnessFactor = mix(metalnessFactor, gOrm.b, gOrm.a * uBake);
#endif`;
const BAKE_U = { bakeMap: { value: null }, ormMap: { value: null }, uBake: { value: 1 }, uDebug: { value: location.hash === "#coverage" ? 1 : 0 } };
const v3 = (c) => `vec3(${c.map((x) => x.toFixed(3)).join(",")})`;
function woodGLSL(a, b, g) {
  return `
  float tint = vColor.r; float edge = vColor.g;
  vec2 wuv = vUv + vec2(tint * 13.7, tint * 5.3);
  vec3 baseA = s2l(${v3(a)}), baseB = s2l(${v3(b)}), grain = s2l(${v3(g)});
  float warp = fb(vec2(wuv.x * 1.6, wuv.y * 5.0));
  float lines = fb(vec2(wuv.x * 1.2, wuv.y * 26.0 + warp * 5.0));
  float streak = smoothstep(0.5, 0.8, lines);
  float row = wuv.y * 13.0 + warp * 0.7;
  float l = abs(fract(row) - 0.5);
  float thin = smoothstep(0.07, 0.015, l) * smoothstep(0.35, 0.6, vn(vec2(wuv.x * 2.2, floor(row) * 3.1)));
  vec2 kc = vec2(wuv.x * 1.3 + tint, wuv.y * 5.5 + tint * 2.0);
  vec2 kp = vec2(fract(kc.x) - 0.5, (fract(kc.y) - 0.5) * 0.35);
  float knot = smoothstep(0.035, 0.0, length(kp) - 0.01) * step(0.62, hsh(floor(kc)));
  vec3 c = mix(baseA, baseB, fb(wuv * vec2(2.5, 9.0)));
  c = mix(c, grain, streak * 0.4);
  c = mix(c, grain * 0.8, thin * 0.75);
  c = mix(c, grain * 0.7, knot * 0.8);
  c *= 0.94 + 0.1 * vn(vec2(wuv.x * 6.0, wuv.y * 160.0));
  c *= mix(0.84, 1.1, tint);
  c = mix(c, c * 1.45 + vec3(0.04, 0.02, 0.0), edge * 0.8);
  diffuseColor.rgb = c;
  gA = streak;`;
}
const BRASS_GLSL = `
  float n = fb(vLpos.xy * 38.0 + vLpos.z * 23.0);
  float spots = smoothstep(0.66, 0.8, fb(vLpos.zy * 55.0 + vLpos.x * 41.0));
  vec3 dk = s2l(vec3(0.21, 0.18, 0.08)), lt = s2l(vec3(0.52, 0.46, 0.25));
  vec3 c = mix(dk, lt, 0.45 + 0.4 * (n - 0.5));
  c = mix(c, dk * 0.7, spots * 0.45);
  c = mix(c, lt * 1.25, vColor.g * 0.7);
  diffuseColor.rgb = c;
  gA = n; gB = vColor.g;`;

function procMaterial(key, colorCode, roughCode, metalness, baked = false) {
  const m = new THREE.MeshStandardMaterial({ vertexColors: true, metalness, roughness: 0.7, envMapIntensity: 0.3 });
  m.customProgramCacheKey = () => "chest-" + key;
  m.defines = baked ? { USE_UV: "", USE_UV1: "", CHEST_BAKED: "" } : { USE_UV: "" };
  m.onBeforeCompile = (sh) => {
    if (baked) Object.assign(sh.uniforms, BAKE_U);
    sh.vertexShader = sh.vertexShader
      .replace("#include <common>", "#include <common>\nvarying vec3 vLpos;" + (baked ? "\nvarying vec2 vBakeUv;" : ""))
      .replace("#include <begin_vertex>", "#include <begin_vertex>\nvLpos = position;" + (baked ? "\nvBakeUv = uv1;" : ""));
    sh.fragmentShader = sh.fragmentShader
      .replace("#include <common>", "#include <common>\n" + GLSL_COMMON)
      .replace("#include <color_fragment>", colorCode + BAKE_COLOR)
      .replace("#include <roughnessmap_fragment>", roughCode + BAKE_ROUGH)
      .replace("#include <metalnessmap_fragment>", BAKE_METAL);
  };
  return m;
}
const MATS = {
  wood: procMaterial("wood", woodGLSL([0.40, 0.21, 0.10], [0.60, 0.35, 0.18], [0.22, 0.10, 0.045]), "float roughnessFactor = 0.8 - gA * 0.1;", 0.0, true),
  wood_dark: procMaterial("wood_dark", woodGLSL([0.24, 0.11, 0.05], [0.34, 0.16, 0.07], [0.15, 0.06, 0.03]), "float roughnessFactor = 0.85;", 0.0),
  brass: procMaterial("brass", BRASS_GLSL, "float roughnessFactor = clamp(mix(0.38, 0.7, gA) - gB * 0.15, 0.05, 1.0);", 0.5, true),
  gold: new THREE.MeshStandardMaterial({ color: "#ffc247", metalness: 1, roughness: 0.28, emissive: "#8c5c14", emissiveIntensity: 0.6 }),
  gold_pile: new THREE.MeshStandardMaterial({ color: "#9e6b1f", metalness: 0.8, roughness: 0.5 }),
  dark: new THREE.MeshStandardMaterial({ color: "#080504", roughness: 1 }),
};

// ---------- models
const loader = new GLTFLoader();
const models = { rebuilt: null, meshy: null };
let current = "rebuilt";
let pivot = null, glow = null;
let open = 0, target = 0, animFrom = 0, animStart = 0, animDur = 0, animEase = null;

function countTris(root) {
  let t = 0;
  root.traverse((o) => { if (o.isMesh) { const g = o.geometry; t += (g.index ? g.index.count : g.attributes.position.count) / 3; } });
  return Math.round(t);
}
function prep(root) {
  root.traverse((o) => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } });
}
const fmt = (n) => n.toLocaleString("en-US");
// Models ship as base64 text files; decode and hand the bytes to GLTFLoader.
async function loadGLB(url) {
  const res = await fetch(url);
  if (!res.ok) throw new Error(res.status);
  const bin = atob((await res.text()).trim());
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return loader.parseAsync(bytes.buffer, "");
}

function loadTex(url, srgb) {
  return new THREE.TextureLoader().loadAsync(url).then((t) => {
    t.flipY = false;
    t.colorSpace = srgb ? THREE.SRGBColorSpace : THREE.NoColorSpace;
    t.anisotropy = 4;
    return t;
  });
}
Promise.all([loadGLB("chest_baked.glb.txt"), loadTex("chest_baked_albedo.webp", true), loadTex("chest_baked_orm.webp", false)]).then(([gltf, alb, orm]) => {
  BAKE_U.bakeMap.value = alb;
  BAKE_U.ormMap.value = orm;
  const root = gltf.scene;
  root.traverse((o) => {
    if (!o.isMesh) return;
    const name = (o.material.name || "").replace(/\d+$/, "");
    if (MATS[name]) o.material = MATS[name];
  });
  prep(root);
  pivot = root.getObjectByName("LidPivot");
  buildArtifacts(root);
  glow = new THREE.PointLight("#ffc56b", 0, 1.6, 2);
  glow.position.set(0, 0.7, 0.05);
  root.add(glow);
  root.userData.tris = countTris(root);
  models.rebuilt = root;
  scene.add(root);
  $("loader").hidden = true;
  setModel("rebuilt");
  prewarm();
}).catch(() => { $("loader").textContent = "Couldn't load the chest model. Reload the page to try again."; });

let meshyLoading = false;
function loadMeshy() {
  if (meshyLoading) return;
  meshyLoading = true;
  $("loader").hidden = false;
  $("loader").textContent = "Loading Meshy model…";
  loadGLB("meshy.glb.txt").then((gltf) => {
    const root = gltf.scene;
    prep(root);
    root.traverse((o) => { if (o.isMesh) o.material.envMapIntensity = 0.55; });
    const box = new THREE.Box3().setFromObject(root);
    const size = box.getSize(new THREE.Vector3());
    const s = 1.07 / size.x;
    root.scale.setScalar(s);
    const c = box.getCenter(new THREE.Vector3());
    root.position.set(-c.x * s, -box.min.y * s, -c.z * s);
    root.userData.tris = countTris(root);
    models.meshy = root;
    root.visible = false;
    scene.add(root);
    $("loader").hidden = true;

  lastNow = now;
  const on = current === "rebuilt";
  fx.visible = on;
  const targetI = on ? THREE.MathUtils.smoothstep(open, 0.2, 0.75) : 0;
  fxI += (targetI - fxI) * Math.min(1, dt * 3);
  // while the lid strains, light leaks out of the gap
  const leak = on && seqStart >= 0 && open < 0.3 ? Math.min(1, open * 20) : 0;
  fxI = Math.max(fxI, leak * 0.3);
  const age = burstAt < 0 ? 99 : (now - burstAt) / 1000;
  FX_U.uTime.value = now / 1000;
  FX_U.uIntensity.value = fxI;
  FX_U.uBurstAge.value = age;
  FX_U.uBurst.value = burstAt < 0 ? 0 : Math.exp(-age * 2.2);
  // vortex: spins up with the burst and dissipates after a few seconds
  FX_U.uSwirl.value = burstAt < 0 ? 0 : THREE.MathUtils.smoothstep(age, 0.0, 0.25) * (1 - THREE.MathUtils.smoothstep(age, 2.4, 4.6));
  // flash: very brief and very bright
  const fl = burstAt < 0 || age > 1 ? 0 : Math.exp(-age * 11) * THREE.MathUtils.smoothstep(age, 0, 0.03);
  FX_U.uFlash.value = fl;
  flash.material.opacity = Math.min(0.85, fl);
  flash.scale.setScalar(0.7 + 1.5 * Math.sqrt(Math.min(age, 1)));
  flash.visible = fl > 0.003;
  const sa = Math.max(0, 1 - age / 0.5);
  shock.visible = burstAt >= 0 && sa > 0 && fxI > 0;
  shock.scale.set(0.25 + age * 3.4, 0.25 + age * 3.4 * 0.75, 1);
  shock.material.uniforms.uA.value = sa * sa * sa * 0.55;
  bloom.strength = 0.55 + fl * 0.9;
  renderer.toneMappingExposure = 1.3 + fl * 0.3;
  const hh = (now / 1000) * 0.08 % 1;
  magicLight.color.copy(_hsl.setHSL(0.72 + 0.2 * Math.sin(hh * 6.28), 0.8, 0.6));
  magicLight.intensity = fxI * (2.5 + FX_U.uBurst.value * 3) + fl * 12;
  if (glow) glow.intensity = 4.5 * Math.max(THREE.MathUtils.smoothstep(open, 0.1, 0.6), leak * 0.45) * (1 + FX_U.uBurst.value * 0.8) * (0.92 + 0.08 * Math.sin(now / 160)) + fl * 14;
  updateVacuum(now);
  updateCloseSeq(now);
  if (vacStart < 0 && open < 0.05 && FX_U.uSuck.value > 0) { FX_U.uSuck.value = 0; fxI = 0; }
  const k = FX_U.uSuck.value;
  column.scale.set(1 - 0.85 * k, 1 - 0.8 * k, 0.6 * (1 - 0.85 * k));
  column.position.y = 0.44 + 0.8 * column.scale.y;
  magicLight.intensity *= 1 + 1.5 * k;
  column.visible = pool.visible = fxI > 0.002;
  updateLoot(now, dt);
}

// ---------- treasure artifacts resting in the pile (they ride along with the chest)
function buildArtifacts(root) {
  const g = new THREE.Group();
  g.name = "Artifacts";
  const silver = new THREE.MeshStandardMaterial({ color: "#dfe4ec", metalness: 1, roughness: 0.16, envMapIntensity: 1.3 });
  const gold = new THREE.MeshStandardMaterial({ color: "#ffcf4a", metalness: 1, roughness: 0.24, emissive: "#6b4708", emissiveIntensity: 0.25 });
  const paper = new THREE.MeshStandardMaterial({ color: "#d8c196", roughness: 0.92, metalness: 0 });
  const paperEdge = new THREE.MeshStandardMaterial({ color: "#a98c5c", roughness: 0.95 });
  const ribbon = new THREE.MeshStandardMaterial({ color: "#8e1b22", roughness: 0.55 });
  const wood = new THREE.MeshStandardMaterial({ color: "#4a2a16", roughness: 0.7 });
  const jewel = (c, r) => {
    const m = new THREE.Mesh(new THREE.OctahedronGeometry(r, 0), new THREE.MeshPhysicalMaterial({ color: c, roughness: 0, flatShading: true, ior: 2, specularIntensity: 1, clearcoat: 1, emissive: c, emissiveIntensity: 0.5, envMapIntensity: 2.5 }));
    m.castShadow = true;
    return m;
  };
  const place = (obj, x, z, sink, rot, scale = 1.6) => {
    obj.scale.multiplyScalar(scale);
    obj.position.set(x, mound(x, z) - sink * scale, z);
    obj.rotation.set(rot[0], rot[1], rot[2]);
    obj.traverse((o) => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } });
    g.add(obj);
  };

  // silver goblet: foot, knotted stem, bowl, with a band of small jewels
  const goblet = new THREE.Group();
  goblet.add(new THREE.Mesh(new THREE.LatheGeometry([[0, 0], [0.05, 0], [0.052, 0.008], [0.03, 0.018], [0.012, 0.03], [0.011, 0.06], [0.02, 0.07], [0.011, 0.08], [0.012, 0.095],
    [0.03, 0.105], [0.05, 0.13], [0.058, 0.17], [0.06, 0.2], [0.056, 0.2], [0.053, 0.172], [0.045, 0.135], [0, 0.118]].map(([a, b]) => new THREE.Vector2(a, b)), 32), silver));
  for (let i = 0; i < 5; i++) {
    const j = jewel(["#e0103f", "#1f48e8", "#0fb862"][i % 3], 0.009);
    const a = (i / 5) * Math.PI * 2;
    j.position.set(Math.cos(a) * 0.056, 0.16, Math.sin(a) * 0.056);
    goblet.add(j);
  }
  place(goblet, -0.27, 0.03, 0.04, [0.15, 0.4, 0.42]);

  // ornate cross: gold bars with orb finials and a ruby heart
  const cross = new THREE.Group();
  const bar = (w, h) => new THREE.Mesh(new THREE.BoxGeometry(w, h, 0.016), gold);
  cross.add(bar(0.026, 0.22));
  const arm = bar(0.15, 0.026); arm.position.y = 0.05; cross.add(arm);
  for (const [x, y] of [[0, 0.115], [0, -0.115], [0.078, 0.05], [-0.078, 0.05]]) {
    const orb = new THREE.Mesh(new THREE.SphereGeometry(0.016, 16, 12), gold); orb.position.set(x, y, 0); cross.add(orb);
  }
  const heart = jewel("#e0103f", 0.018); heart.position.set(0, 0.05, 0.012); heart.scale.set(1, 1.3, 0.6); cross.add(heart);
  place(cross, 0.15, -0.1, -0.06, [-0.65, 0.2, 0.25]);

  // worn parchment scrolls with wooden rods and ribbon ties
  const scroll = (len) => {
    const s = new THREE.Group();
    const body = new THREE.Mesh(new THREE.CylinderGeometry(0.022, 0.022, len, 20), paper); body.rotation.z = Math.PI / 2; s.add(body);
    for (const sx of [-1, 1]) {
      const edge = new THREE.Mesh(new THREE.CylinderGeometry(0.0225, 0.0225, 0.012, 20), paperEdge); edge.rotation.z = Math.PI / 2; edge.position.x = sx * (len / 2 - 0.006); s.add(edge);
      const knob = new THREE.Mesh(new THREE.SphereGeometry(0.012, 12, 8), wood); knob.position.x = sx * (len / 2 + 0.012); s.add(knob);
    }
    const tie = new THREE.Mesh(new THREE.TorusGeometry(0.0235, 0.004, 8, 24), ribbon); tie.rotation.y = Math.PI / 2; s.add(tie);
    const tail = new THREE.Mesh(new THREE.BoxGeometry(0.008, 0.05, 0.002), ribbon); tail.position.set(0.006, -0.03, 0.022); tail.rotation.z = 0.3; s.add(tail);
    return s;
  };
  place(scroll(0.24), 0.02, 0.1, 0.0, [0.1, -0.5, 0.18]);
  place(scroll(0.19), -0.06, -0.12, -0.03, [0.2, 0.9, 0.7]);

  // small crown studded with gems
  const crown = new THREE.Group();
  crown.add(new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.055, 0.04, 32, 1, true), gold));
  for (let i = 0; i < 7; i++) {
    const a = (i / 7) * Math.PI * 2;
    const spike = new THREE.Mesh(new THREE.ConeGeometry(0.012, 0.045, 6), gold);
    spike.position.set(Math.cos(a) * 0.058, 0.04, Math.sin(a) * 0.058); crown.add(spike);
    const tip = new THREE.Mesh(new THREE.SphereGeometry(0.006, 8, 6), gold); tip.position.set(Math.cos(a) * 0.058, 0.064, Math.sin(a) * 0.058); crown.add(tip);
    const j = jewel(GEM_COLORS[i % GEM_COLORS.length], 0.008); j.position.set(Math.cos(a) * 0.062, 0.0, Math.sin(a) * 0.062); crown.add(j);
  }
  place(crown, 0.33, 0.06, 0.0, [0.3, 0, -0.35]);

  // a few big stones sitting in the pile
  for (const [x, z, c, sz] of [[-0.12, 0.08, "#1f48e8", 0.035], [0.27, -0.1, "#0fb862", 0.03], [-0.36, -0.08, "#8a2be2", 0.028]]) {
    const j = jewel(c, sz); place(j, x, z, -0.01, [rand(0, 3), rand(0, 3), rand(0, 3)], 1.3);
  }
  root.add(g);
  return g;
}

// ---------- stage lighting: dark room, one adjustable spotlight on the chest
const SPOT = { intensity: 1, radius: 1.1, color: new THREE.Color("#ffe2b8"), boost: 1 };
const spot = new THREE.SpotLight("#ffe2b8", 0, 0, 0.4, 0.75, 1.0);
spot.position.set(0.35, 3.6, 1.1);
spot.target.position.set(0, 0.3, 0);
spot.castShadow = true;
spot.shadow.mapSize.set(2048, 2048);
spot.shadow.bias = -0.0003;
spot.shadow.normalBias = 0.02;
spot.shadow.camera.near = 1; spot.shadow.camera.far = 8;
scene.add(spot, spot.target);
// faint visible beam so the light reads as a stage spot in the dark
const beam = new THREE.Mesh(new THREE.ConeGeometry(1, 1, 48, 1, true), new THREE.ShaderMaterial({
  uniforms: { uColor: { value: new THREE.Color() }, uA: { value: 0 } }, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, side: THREE.DoubleSide,
  vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
  fragmentShader: `uniform vec3 uColor; uniform float uA; varying vec2 vUv;
    void main(){ float a = uA * smoothstep(0.0, 0.9, 1.0 - vUv.y) * 0.5 * (0.6 + 0.4 * sin(vUv.x * 6.2832 * 3.0)); gl_FragColor = vec4(uColor * a, a); }`,
}));
scene.add(beam);
function applySpot(dt) {
  const h = spot.position.distanceTo(spot.target.position);
  spot.angle = Math.min(1.2, Math.atan(SPOT.radius / h));
  spot.color.copy(SPOT.color);
  spot.intensity = 26 * SPOT.intensity * SPOT.boost;
  // beam cone from the light down to the floor
  const top = spot.position, base = new THREE.Vector3(spot.target.position.x, 0, spot.target.position.z);
  const len = top.distanceTo(base);
  beam.position.copy(top).add(base).multiplyScalar(0.5);
  beam.scale.set(SPOT.radius * 1.05, len, SPOT.radius * 1.05);
  beam.quaternion.setFromUnitVectors(new THREE.Vector3(0, -1, 0), base.clone().sub(top).normalize());
  beam.material.uniforms.uColor.value.copy(SPOT.color);
  beam.material.uniforms.uA.value = 0.12 * SPOT.intensity * SPOT.boost;
}

// ---------- glints: little star flashes on coins and gems that catch the spotlight
const GLINTS = 520;
const glintGeo = new THREE.BufferGeometry();
const glintPos = new Float32Array(GLINTS * 3), glintA = new Float32Array(GLINTS), glintSeed = new Float32Array(GLINTS);
for (let i = 0; i < GLINTS; i++) glintSeed[i] = Math.random();
glintGeo.setAttribute("position", new THREE.BufferAttribute(glintPos, 3));
glintGeo.setAttribute("aA", new THREE.BufferAttribute(glintA, 1));
glintGeo.setAttribute("aSeed", new THREE.BufferAttribute(glintSeed, 1));
const glintMat = new THREE.ShaderMaterial({
  uniforms: { uScale: FX_U.uScale, uColor: { value: new THREE.Color() } }, transparent: true, depthWrite: false, depthTest: true, blending: THREE.AdditiveBlending,
  vertexShader: `uniform float uScale; attribute float aA; attribute float aSeed; varying float vA; varying float vRot;
    void main(){ vec4 mv = modelViewMatrix * vec4(position, 1.0); gl_Position = projectionMatrix * mv; vA = aA; vRot = aSeed * 3.14;
      gl_PointSize = (0.03 + 0.03 * aSeed) * aA * uScale / max(-mv.z, 0.1); }`,
  fragmentShader: `uniform vec3 uColor; varying float vA; varying float vRot;
    void main(){ vec2 c = gl_PointCoord - 0.5; float cs = cos(vRot), sn = sin(vRot); c = mat2(cs, -sn, sn, cs) * c;
      float s = max(0.0, 1.0 - abs(c.x) * 18.0) * smoothstep(0.5, 0.0, abs(c.y)) + max(0.0, 1.0 - abs(c.y) * 18.0) * smoothstep(0.5, 0.0, abs(c.x));
      float core = smoothstep(0.12, 0.0, length(c));
      float a = (s * 0.9 + core) * vA; if (a < 0.01) discard; gl_FragColor = vec4(mix(uColor, vec3(1.0), 0.6) * a * 2.2, a); }`,
});
const glints = new THREE.Points(glintGeo, glintMat);

// ---------- inflow: sparks streaming into the chest mouth during the vacuum close (closed form on the GPU)
const INFLOW = 700;
const INFLOW_U = { uTime: { value: 0 }, uOn: { value: 0 }, uScale: FX_U.uScale, uMouth: { value: new THREE.Vector3(0, 0.6, 0.06) } };
const inflowGeo = new THREE.BufferGeometry();
const inflowSeed = new Float32Array(INFLOW * 4);
for (let i = 0; i < inflowSeed.length; i++) inflowSeed[i] = Math.random();
inflowGeo.setAttribute("position", new THREE.BufferAttribute(new Float32Array(INFLOW * 3), 3));
inflowGeo.setAttribute("aSeed", new THREE.BufferAttribute(inflowSeed, 4));
const inflow = new THREE.Points(inflowGeo, new THREE.ShaderMaterial({
  uniforms: INFLOW_U, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
  vertexShader: `uniform float uTime; uniform float uOn; uniform float uScale; uniform vec3 uMouth; attribute vec4 aSeed; varying float vA; varying float vK;
    void main(){
      float life = 0.45 + 0.45 * aSeed.x;
      float ph = fract(uTime / life + aSeed.y);
      float k = pow(ph, 1.8);                                   // accelerate into the mouth
      float th = aSeed.z * 6.2832 + k * 2.4;                    // spiral in
      float el = aSeed.w * 1.15 - 0.15;
      float r = (0.75 + 0.85 * fract(aSeed.x * 7.31)) * (1.0 - k);
      vec3 p = uMouth + vec3(cos(th) * cos(el), sin(el) * 0.85 + 0.12 * (1.0 - k), sin(th) * cos(el)) * r;
      vec4 mv = modelViewMatrix * vec4(p, 1.0); gl_Position = projectionMatrix * mv;
      vA = uOn * smoothstep(0.0, 0.12, ph) * (1.0 - smoothstep(0.9, 1.0, ph)); vK = k;
      gl_PointSize = (0.010 + 0.012 * aSeed.y) * (0.6 + 0.9 * k) * uScale / max(-mv.z, 0.1); }`,
  fragmentShader: `varying float vA; varying float vK;
    void main(){ float d = length(gl_PointCoord - 0.5); float a = smoothstep(0.5, 0.0, d) * vA; if (a < 0.01) discard;
      vec3 c = mix(vec3(1.0, 0.72, 0.3), vec3(1.0, 0.95, 0.85), vK); gl_FragColor = vec4(c * a * 2.0, a); }`,
}));
inflow.frustumCulled = false; inflow.visible = false; inflow.renderOrder = 7;
scene.add(inflow);
glints.frustumCulled = false;
glints.renderOrder = 6;
scene.add(glints);
const pileGlints = Array.from({ length: 70 }, () => { const x = rand(-0.42, 0.42), z = rand(-0.22, 0.22); return new THREE.Vector3(x, mound(x, z) + 0.01, z); });
const _gv = new THREE.Vector3();
function updateGlints(now) {
  const t = now / 1000;
  const light = SPOT.intensity * SPOT.boost;
  glintMat.uniforms.uColor.value.copy(SPOT.color);
  let n = 0;
  const showPile = current === "rebuilt" && open > 0.3 && models.rebuilt;
  const emit = (p, rate, seed, gain) => {
    if (n >= GLINTS) return;
    // a sharp, brief flash: the facet lines up with the light for a moment
    const ph = Math.sin(t * rate + seed * 40.0);
    const a = Math.pow(Math.max(0, ph), 28) * gain * light;
    glintPos[n * 3] = p.x; glintPos[n * 3 + 1] = p.y; glintPos[n * 3 + 2] = p.z;
    glintA[n] = Math.min(1.6, a);
    n++;
  };
  for (let i = 0; i < loot.length && n < GLINTS; i++) {
    const it = loot[i];
    if (it.recall || it.vac) continue;
    _gv.copy(it.mesh.position); _gv.y += it.rc;
    emit(_gv, it.kind === "gem" ? 2.2 + (i % 5) * 0.4 : 1.1 + (i % 3) * 0.3, glintSeed[n], it.kind === "gem" ? 1.2 : 0.8);
  }
  if (showPile) for (let i = 0; i < pileGlints.length; i++) { _gv.copy(pileGlints[i]).applyMatrix4(models.rebuilt.matrixWorld); emit(_gv, 1.3 + (i % 4) * 0.35, glintSeed[n], 0.9); }
  for (let i = n; i < GLINTS; i++) glintA[i] = 0;
  glintGeo.attributes.position.needsUpdate = true;
  glintGeo.attributes.aA.needsUpdate = true;
  glints.visible = current === "rebuilt";
}

const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
// clamp HDR spikes (a coin passing right by a light) so bloom stays soft instead of blocky
composer.addPass(new ShaderPass({
  uniforms: { tDiffuse: { value: null } },
  vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
  fragmentShader: `uniform sampler2D tDiffuse; varying vec2 vUv; void main(){ vec4 c = texture2D(tDiffuse, vUv); gl_FragColor = vec4(min(c.rgb, vec3(3.0)), c.a); }`,
}));
const bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.55, 0.4, 0.92);
composer.addPass(bloom);
composer.addPass(new OutputPass());

// ---------- performance: compile every shader the burst will need up front, so the
// first open doesn't hitch while the GPU driver builds programs mid-animation
function prewarm() {
  const dummies = [new THREE.Mesh(coinGeo, coinMaterial()), new THREE.Mesh(gemGeos[0], gemMaterial(false)), new THREE.Mesh(gemGeos[1], gemMaterial(true))];
  dummies.forEach((d, i) => { d.position.set(-0.2 + i * 0.2, 0.33, 0); d.scale.setScalar(0.02); d.castShadow = true; fx.add(d); });
  const vis = [flash.visible, shock.visible, column.visible, pool.visible, glints.visible, inflow.visible];
  flash.visible = shock.visible = column.visible = pool.visible = glints.visible = inflow.visible = true;
  // compile against the composer's render target: that's where the scene really draws
  // (linear output, tone mapping applied later), so the cached programs match exactly
  renderer.setRenderTarget(composer.readBuffer);
  renderer.compile(scene, camera);
  renderer.setRenderTarget(null);
  composer.render(); // also builds shadow-depth programs and the transmission target
  [flash.visible, shock.visible, column.visible, pool.visible, glints.visible, inflow.visible] = vis;
  dummies.forEach((d) => { fx.remove(d); d.material.dispose(); });
}

// ---------- sizing: keep the chest framed above the tray at any aspect
const FIT_PULLBACK = 2.0; // default view sits back far enough to see the whole burst and spill
const DEFAULT_DIR = new THREE.Vector3(-0.62, 0.42, 1.0).normalize();
let fitPending = true;
function resize(refit = true) {
  // a host can load the page in a 0x0 frame before showing it; never fit to that (it gives a NaN camera)
  const hidden = !(innerWidth > 0 && innerHeight > 0);
  const w = Math.max(1, innerWidth), h = Math.max(1, innerHeight);
  renderer.setSize(w, h);
  composer.setPixelRatio(renderer.getPixelRatio());
  composer.setSize(w, h);
  camera.aspect = w / h;
  const tray = document.querySelector(".tray").getBoundingClientRect().height;
  camera.setViewOffset(w, h, 0, tray * 0.42, w, h);
  camera.updateProjectionMatrix();
  const half = THREE.MathUtils.degToRad(camera.fov / 2);
  FX_U.uScale.value = h * renderer.getPixelRatio() / (2 * Math.tan(half));
  if (hidden) { fitPending = true; return; }
  if (!refit && !fitPending) return;
  fitPending = false;
  // 6 m was the old effective cap on tall phones; the pullback doubles whatever the old view was
  const fit = FIT_PULLBACK * Math.min(6, Math.max(0.8 / Math.tan(half), 1.0 / (Math.tan(half) * camera.aspect)));
  const dir = camera.position.clone().sub(controls.target);
  if (!Number.isFinite(dir.lengthSq()) || dir.lengthSq() < 1e-8) dir.copy(DEFAULT_DIR);
  camera.position.copy(controls.target).add(dir.normalize().multiplyScalar(fit));
}
addEventListener("resize", () => resize(true));
window.__viewer = { camera, controls, BAKE_U, renderer, loot, scene, pose: (t) => { seqStart = -1; animDur = 0; const k = openTimeline(t); setOpen(k.lid); setChestPose(k.rock, k.lift); } };
resize();

const perf = { last: 0, acc: 0, n: 0, minRatio: 1 };
function adaptQuality(now) {
  if (perf.last) {
    const dt = now - perf.last;
    if (dt < 250) { perf.acc += dt; perf.n++; } // ignore tab switches
  }
  perf.last = now;
  if (perf.n >= 45) {
    const avg = perf.acc / perf.n;
    const pr = renderer.getPixelRatio();
    if (avg > 28 && pr > perf.minRatio) {
      renderer.setPixelRatio(Math.max(perf.minRatio, pr - 0.25));
      resize(false);
    }
    perf.acc = 0; perf.n = 0;
  }
}

renderer.setAnimationLoop((now) => {
  adaptQuality(now);
  if (seqStart >= 0) {
    const t = now - seqStart;
    const k = openTimeline(Math.min(t, SEQ_END));
    setOpen(k.lid);
    setChestPose(k.rock, k.lift);
    if (t >= SEQ_END) { seqStart = -1; setOpen(1); setChestPose(0, 0); }
  } else if (animDur > 0) {
    const t = Math.min(1, (now - animStart) / animDur);
    setOpen(animFrom + (target - animFrom) * animEase(t));
    if (t >= 1) animDur = 0;
  }
  updateFX(now);
  const boostTarget = current === "rebuilt" && (seqStart >= 0 || open > 0.3) ? 1.4 : 1;
  SPOT.boost += (boostTarget - SPOT.boost) * 0.06;
  applySpot();
  updateGlints(now);
  camera.position.sub(camShakeOff);
  controls.update();
  INFLOW_U.uTime.value = now / 1000;
  camShake *= 0.86;
  camShakeOff.set(Math.sin(now * 0.091) * camShake, Math.sin(now * 0.137 + 1.3) * camShake * 1.3, Math.sin(now * 0.113 + 2.1) * camShake * 0.6);
  { const d = camera.position.distanceTo(controls.target); if (Number.isFinite(d)) { scene.fog.near = d + 0.2; scene.fog.far = d + 4.2; } }
  camera.position.add(camShakeOff);
  if (FX_U.uFlash.value > 0.05) camera.position.add(new THREE.Vector3(rand(-1, 1), rand(-1, 1), rand(-1, 1)).multiplyScalar(0.012 * FX_U.uFlash.value));
  composer.render();
});
setOpen(0);
</script>

</body>
</html>
